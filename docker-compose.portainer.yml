services:
  mysql:
    image: bigcapital-mysql:local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bigcapital_system
      MYSQL_USER: bigcapital
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - bigcapital_network

  redis:
    image: bigcapital-redis:local
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis:/data
    networks:
      - bigcapital_network

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - bigcapital_network

  database_migration:
    image: bigcapital-migration:local
    restart: "no"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: bigcapital
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital_system
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
    networks:
      - bigcapital_network

  server:
    image: bigcapital-server:local
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - mysql
      - redis
    environment:
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      DB_HOST: mysql
      DB_USER: bigcapital
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: utf8
      SYSTEM_DB_NAME: bigcapital_system
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      TENANT_DB_NAME_PERFIX: bigcapital_tenant_
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: http://localhost:8081
      SIGNUP_DISABLED: "false"
      SIGNUP_ALLOWED_DOMAINS: ""
      SIGNUP_ALLOWED_EMAILS: ""
      SIGNUP_EMAIL_CONFIRMATION: "false"
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://server:3000/public/
      EXCHANGE_RATE_SERVICE: open-exchange-rate
      OPEN_EXCHANGE_RATE_APP_ID: ""
      BANK_FEED_ENABLED: ""
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ""
      PLAID_SECRET: ""
      PLAID_LINK_WEBHOOK: ""
      LEMONSQUEEZY_API_KEY: ""
      LEMONSQUEEZY_STORE_ID: ""
      LEMONSQUEEZY_WEBHOOK_SECRET: ""
      HOSTED_ON_BIGCAPITAL_CLOUD: ""
      S3_REGION: US
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_ENDPOINT: ""
      S3_BUCKET: ""
      STRIPE_PAYMENT_SECRET_KEY: ""
      STRIPE_PAYMENT_PUBLISHABLE_KEY: ""
      STRIPE_PAYMENT_CLIENT_ID: ""
      STRIPE_PAYMENT_WEBHOOKS_SECRET: ""
      STRIPE_PAYMENT_REDIRECT_URL: ""
    networks:
      - bigcapital_network

  webapp:
    image: bigcapital-webapp:local
    restart: unless-stopped
    networks:
      - bigcapital_network

  proxy:
    image: bigcapital-proxy:local
    restart: unless-stopped
    depends_on:
      - server
      - webapp
    tty: true
    ports:
      - "8081:80"
      - "443:443"
    networks:
      - bigcapital_network

volumes:
  mysql:
    name: bigcapital_prod_mysql
  redis:
    name: bigcapital_prod_redis

networks:
  bigcapital_network:
    driver: bridge
