name: Build and publish images (GHCR)

# Builds the fork's images and pushes them to GitHub Container Registry
# (ghcr.io/astrofoundry/bigcapital-<service>) on every code change to the
# astrofoundry branch. These images are consumed by the CORTEX GitOps stack.
#
# The migration image is built FROM this run's fork server image (not upstream
# bigcapitalhq/server:latest), so the migration set always matches the app.

on:
  push:
    branches: [astrofoundry]
    paths:
      - "packages/server/**"
      - "packages/webapp/**"
      - "shared/**"
      - "docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "lerna.json"
      - ".github/workflows/build-publish-ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: astrofoundry

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.vars.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  images:
    name: build ${{ matrix.service }}
    needs: setup
    # Target is the Apple M4 (arm64) Mac mini, so images are arm64.
    # ubuntu-24.04-arm is a native arm64 GitHub-hosted runner (free for public repos).
    # If arm64 runners become unavailable, switch to ubuntu-latest and add a
    # "docker/setup-qemu-action@v3" step before buildx (slower, emulated).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: "."
            file: packages/server/Dockerfile
          - service: webapp
            context: "."
            file: packages/webapp/Dockerfile
          - service: proxy
            context: docker/envoy
            file: docker/envoy/Dockerfile
          - service: mysql
            context: docker/mariadb
            file: docker/mariadb/Dockerfile
          - service: redis
            context: docker/redis
            file: docker/redis/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=astrofoundry
            type=raw,value=${{ needs.setup.outputs.sha7 }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migration:
    name: build migration
    needs: [setup, images]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-migration
          tags: |
            type=raw,value=latest
            type=raw,value=astrofoundry
            type=raw,value=${{ needs.setup.outputs.sha7 }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "."
          file: docker/migration/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            SERVER_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/bigcapital-server:${{ needs.setup.outputs.sha7 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
